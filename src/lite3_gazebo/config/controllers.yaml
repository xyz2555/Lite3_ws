controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lite3_position_controller:
      type: forward_command_controller/ForwardCommandController

    lite3_effort_controller:
      type: forward_command_controller/ForwardCommandController


lite3_position_controller:
  ros__parameters:
    joints:
      - FL_HipX_joint
      - FL_HipY_joint
      - FL_Knee_joint

      - FR_HipX_joint
      - FR_HipY_joint
      - FR_Knee_joint

      - HL_HipX_joint
      - HL_HipY_joint
      - HL_Knee_joint

      - HR_HipX_joint
      - HR_HipY_joint
      - HR_Knee_joint

    interface_name: position

lite3_effort_controller:
  ros__parameters:
    joints:
      - FL_HipX_joint
      - FL_HipY_joint
      - FL_Knee_joint

      - FR_HipX_joint
      - FR_HipY_joint
      - FR_Knee_joint

      - HL_HipX_joint
      - HL_HipY_joint
      - HL_Knee_joint

      - HR_HipX_joint
      - HR_HipY_joint
      - HR_Knee_joint

    interface_name: effort